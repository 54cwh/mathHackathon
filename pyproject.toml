[project]
name = "mathhackathon"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "biopython>=1.88",
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evogenesis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", ".opencode", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
