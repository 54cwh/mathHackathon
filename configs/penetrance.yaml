# penetrance 校准与报告配置（实验登记 `experiment/实验与评价体系.md` §3.9；契约 `genome §3`）
#
# 状态：**草案待确认（2026-09-26）**——`θ^obs` 数值与规模未经用户签署前，不得作为结论引用
# （`AGENTS.md`「禁止 AI 填空」）。
#
# 抽样设计：校准与报告都用**分层平衡**抽样（每类 `per_class` 个）——`pen(g)` 以基因型类为条件，
# 分层对它是无偏估计，且能让最小类 `aabb`（9:3:3:1 下 1/16）的 Wilson CI 可控。
# 「9:3:3:1 计数演示」另用**未分层**样本 `demo_offspring`（与 pen 估计分开，delta-B §2.4）。
# 校准/报告用不同命名空间（core §3），报告集不得调阈值。
# threshold_status: unset（默认，报告拒绝）| placeholder（演示用占位值）| confirmed（separable=true 后才可）
threshold_status: unset
# N 轴读数的**测量协议**：每个体把 §5 分裂抽签独立重复 K 次、取**已观测均值** N̄_K。
# 1 = 单次实现（与历史口径逐位一致，仅在 β=0 下有意义）；16 = 本波取定值。
# 实测（配对网格；官方校准 seeds、n=3200、每类 800）—— **居中化前**的原始读数刻度：
#   β=0.0  K=1/16/64 → 全不可分，最小错分 0.500 / 0.500 / 0.500
#   β=1.0  K=1  → 可分离，最小错分 0.425（pen 0.575）
#   β=1.0  K=16 → 可分离，最小错分 **0.288（pen 0.712）**
# **逐 seed 居中后**（2026-09-27；基线 = 该 seed 分层集读数中位数，见 experiment §3.9）：
#   校准集（seeds 20260926/424242，n=3200）N 轴 AUC **0.8433** / p=4.3e-248 / 最小错分 **0.2366**
#   （pen 0.763），θ_N^obs = **−0.0312**（min-misclass ≡ median-midpoint）；报告集（n=4800）
#   AUC 0.8678 / 最小错分 0.2112，逐类 pen 0.7075 / 0.8708 / 0.8042 / 0.7650；
#   H 轴 AUC 0.4862 判不可分离（H 退役的证据）。
#   居中的必要性：不居中时 founder 背景造成 seed 级整体平移（3 seed 读数中位差 ~8 神经元 ≫
#   基因型效应 ~1），池化 AUC 只有 0.6258；居中后 0.8695 ⇒ θ 才可**跨 seed 迁移**。
# ⇒ **K 只有配 β=1.0 才起作用**；K→∞ 即 E[N]，退化为 pen≡1，故不取极限。
# 依据：`docs/参数总表.json` penetrance_realisations_k + `research/notes/契约决策记录.md` 2026-09-27。
realisations_k: 16
# 生效轴：`confirmed` 门禁**只看这些轴**。2026-09-27 用户裁决：H 轴退役 ⇒ 单轴 N。
# 非生效轴（H）仍照常测量并写进 `separation_H`，作为「该轴无区分力」这一退役理由的证据。
active_axes: [N]
# 可选**效应量下限**（AUC）。null = 不启用（当前行为，逐位一致）；启用后门禁为
# (AUC > 0.5) ∧ (p < 0.05) ∧ (AUC >= floor)，用于回答「p<α 只说明显著、不说明效应大」
# （大 n 下 AUC=0.51 也会通过前两条）。**数值须由人签署**（同 θ^obs；禁止 AI 填空）。
# 实测（出货配置、官方校准 seeds、n=3200、K=16、**逐 seed 居中**）：N 轴 AUC 0.8433 —— 故 floor 若取 0.65 通过、取 0.85 不通过。
separation_auc_floor: null
theta_N_obs: null  # 观测量阈值（作用于**逐 seed 居中**的 N=|M| ⇒ 可正可负）；校准产出后人工签署写入
theta_H_obs: null  # 观测量阈值（作用于 CV_τ）；同上
calibration:
  # 独立校准集：`AaBb × AaBb` 自交（genome §3）；种子与报告集不同（独立性）
  master_seeds: [20260926, 424242]
  per_class: 400
  max_offspring: 12000
report:
  master_seeds: [1103, 2207, 3301]
  per_class: 400
  max_offspring: 12000
  demo_offspring: 160  # 未分层、专供 9:3:3:1 计数演示
