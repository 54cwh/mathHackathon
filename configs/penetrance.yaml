# penetrance 校准与报告配置（实验登记 `experiment/实验与评价体系.md` §3.9；契约 `genome §3`）
#
# 状态：**草案待确认（2026-09-26）**——`θ^obs` 数值与规模未经用户签署前，不得作为结论引用
# （`AGENTS.md`「禁止 AI 填空」）。
#
# 抽样设计：校准与报告都用**分层平衡**抽样（每类 `per_class` 个）——`pen(g)` 以基因型类为条件，
# 分层对它是无偏估计，且能让最小类 `aabb`（9:3:3:1 下 1/16）的 Wilson CI 可控。
# 「9:3:3:1 计数演示」另用**未分层**样本 `demo_offspring`（与 pen 估计分开，delta-B §2.4）。
# 校准/报告用不同命名空间（core §3），报告集不得调阈值。
# threshold_status: unset（默认，报告拒绝）| placeholder（演示用占位值）| confirmed（separable=true 后才可）
threshold_status: unset
# N 轴读数的**测量协议**：每个体把 §5 分裂抽签独立重复 K 次、取**已观测均值** N̄_K。
# 1 = 单次实现（与历史口径逐位一致，仅在 β=0 下有意义）；16 = 本波取定值。
# 实测（配对网格；官方校准 seeds、n=3200、每类 800）：
#   β=0.0  K=1/16/64 → 全不可分，最小错分 0.500 / 0.500 / 0.500
#   β=1.0  K=1  → 可分离，最小错分 0.425（pen 0.575）
#   β=1.0  K=16 → 可分离，最小错分 **0.288（pen 0.712）**
# 出货配置实跑（独立 seed 命名空间）：AUC 0.7991 / p=1.0e-188 / 最小错分 0.2847（pen 0.715），
# θ_N^obs 36.469 / 36.062 落区间内部 —— 与配对网格一致，效应跨命名空间稳定。
# ⇒ **K 只有配 β=1.0 才起作用**；K→∞ 即 E[N]，退化为 pen≡1，故不取极限。
# 依据：`docs/参数总表.json` penetrance_realisations_k + `research/notes/契约决策记录.md` 2026-09-27。
realisations_k: 16
theta_N_obs: null  # 观测量阈值（作用于 N=|M|）；校准产出后人工签署写入
theta_H_obs: null  # 观测量阈值（作用于 CV_τ）；同上
calibration:
  # 独立校准集：`AaBb × AaBb` 自交（genome §3）；种子与报告集不同（独立性）
  master_seeds: [20260926, 424242]
  per_class: 400
  max_offspring: 12000
report:
  master_seeds: [1103, 2207, 3301]
  per_class: 400
  max_offspring: 12000
  demo_offspring: 160  # 未分层、专供 9:3:3:1 计数演示
