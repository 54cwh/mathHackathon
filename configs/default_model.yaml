genome:
  chromosome_pairs: 2
  bp_per_haplotype_chromosome: 128
  alphabet: [A, C, G, T]
  motif_count: 8
  motif_length: 6
  motif_topk: 3
  motif_subset_A: 0
  motif_subset_B: 1
phenotype:
  # 阈值表型的架构阈值（`genome §3`）。2026-09-27 重定：E 已是**连续读出**（实测 0.56–0.81），
  # 原约定值 0.25（离散 E∈{0,0.5,1} 的区间中点）会使全体判「高」、p(A)=p(B)≡1；改取
  # **独立校准集**（seed=20260926, n=200）每轴中位：E_A=0.667、E_B=0.694。
  theta_N: 0.67
  theta_H: 0.69
grn:
  dim: 8
  development_steps: 12
  rho: 0.35
  activation: sigmoid
  weight_init: xavier
  spectral_radius: 0.9
  init_b_std: 0.1
development:
  initial_precursors: 24
  domains: [sensory, prey, threat, integrator_memory, inhibitory, motor]
  precursors_per_domain: 4
  max_divisions_per_precursor: 1
  max_neurons: 48
  placement: domain_blocked
  position_space: unit_square
  split_noise: 0.05
  gene_noise: 0.1
  c_domain_bonus: 1.5
  # §7 missing_fate 的 U 跨域散布重定尺度 κ（RGCD §10 实测：κ≤0.8 判据空转、
  # κ≥1.2 断崖成每-seed 赢者通吃；无可用工作点 ⇒ 该判据属设计约定，不贡献区分力）。
  domain_identity_spread_scale: 1.0
  # §5 分裂读数的两个设计增益（RGCD §5）。默认 1.0 / 0.0 = 原式 `sigma(w_d·g + b_d)`
  # **逐位一致**（改变是 opt-in 的）。
  # α 作用在**逐个体中心化**的 GRN 驱动上；β 作用在**基因组通道**（A 位点 motif 亲和 q 的
  # 均值 − 全 motif 均值，索引单一来源 `genome.motif_subset_A`）。
  # **β 是单位规范（gauge），不是校准值**：读数经秩统计量（AUC / 外显率阈分类）读取，
  # 二者对 β>0 的任何单调尺度**不变** ⇒ β 既不需要、也不可能被"标定"
  # （实测 α∈[0.5,16]×β∈[0.05,2] 全平面同值）。α 在逐个体中心化后于线性区
  # **一阶抵消**（Σ_i u_c,i = 0）⇒ 线性区 α 惰性、保持 1.0。
  # **裁决（2026-09-27，用户授权）：β 翻 1.0，K 取 16。**
  # 决定性证据 = **配对 2×4 网格**（同一批基因组；β 只动本键，K 只动
  # `configs/penetrance.yaml::realisations_k`），官方校准 seeds、n=3200（800/类）：
  #   β=0.0：K=1/16/64 **全不可分**，N 轴最小错分 **0.500 / 0.500 / 0.500**（= 多数类基线）
  #   β=1.0：**可分离**，最小错分 **0.425 / 0.288**（K=1/16；pen 0.575 / 0.712）
  # ⇒ 两条独立结论：① **K 单独救不了**（无信号可去噪）；② **β 一开 K=1 即可分**，
  #    K 是其上的**免费**放大（只重抽 §5 分裂抽签，不动发育 / 感知 / Arena）。
  # **为何 K=16 而非 64**：K→∞ 即期望读数 E[N]，退化为 pen≡1；而**不完全外显率
  # 恰是 penetrance 的生物学含义**（Cooper et al.），故取曲线中段而非端点。
  # H 轴恒不可分（最小错分 0.488–0.496）⇒ 停用，单轴 N。
  # **出货配置实测（逐 seed 居中后，2026-09-27）**：校准集 N 轴 AUC 0.8570、p=3.7e-268、
  # min-misclass 0.2219（pen 0.778）、θ_N^obs = −0.0312（居中偏差刻度），n=3200；
  # 报告集 AUC 0.8712 / 最小错分 0.2158。（居中化**前**的原始刻度读数：AUC 0.7991、
  # θ_N^obs 36.469 / 36.062 —— 量纲不同，不可混用。）
  # **代价**：β 改 N ⇒ 须重冻结 **4 处**锚（`tests/test_dump_connectome_matrix.py` 论文锚、
  # `tests/test_fig_connectome.py` 代表个体、`src/evogenesis/development/config.py` 的
  # `DEFAULT_CONFIG` 来源 `division_locus_gain` 默认值、§8 参照实例 `N_ours`
  # 由 index 12(161) 重选为 index 2(151)）+ 论文 5 处数字；Exp C/D/E/F 与
  # demo checkpoint 属**已欠**的 Θ_D 那波（β 增量≈0），由重跑回填。
  # 依据：`research/notes/契约决策记录.md` 2026-09-27 条目（含配对网格与 K 曲线）。
  division_drive_gain: 1.0
  division_locus_gain: 1.0
  zero_input_steps: 50
  saturation_ratio_max: 0.9
  saturation_eps: 0.001
connectome:
  target_density: 0.15
  allow_self_loops: false
  distance_lambda: 2.0
  distance_space: unit_square
  regulatory_gamma: 1.0
  w_bar_initial: 0.5
  # §7(iv) 失配修复：W⁰ 谱半径重定目标（仿 §4 对 W_g 的 0.9）；
  # 依据 §7 实测工作点（(iv) 为唯一绑定约束、89.8% 因 ρ≥1 被拒）。
  rho_w0_target: 0.9
  ablation_random_density: 0.15
  ablation_w_grn: false  # w/o GRN 消融开关（connectome §9；默认关）
  tau_min: 1.0
  tau_max: 10.0
network:
  sensory_dim: 12
  action_dim: 2
  activation: tanh
  input_weight_scope: per_cell_type
  input_weight_std: 0.289
  hunger_gain_std: 0.1
  neuron_bias_std: 0.1
  motor_pool_split: median_x
  action_pooling: mean
learning:
  method: behavior_cloning
  optimizer: adam
  lr: 0.001
  mini_batch_updates: 20
  batch_size: 64
  trajectories: 200
  optional_rl: false
  loss_weight_normalization: per_dim_variance
  loss_variance_floor_ratio: 0.05
  loss_weight_fallback_omega: 0.4
  loss_weight_fallback_v: 1.6
